<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <script src="https://code.jquery.com/jquery-1.12.4.js" integrity="sha256-Qw82+bXyGq6MydymqBxNPYTaUXXq7c8v3CwiYwLLNXU=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
<body>
    
    <div id="app">
        <h2>Gerenciador de Tarefas</h2>

        <div class="controles">
            <input type="text" id="input-tarefa" placeholder="O que precisa ser feito?">
            <button id="btn-adicionar">Adicionar</button>
        </div>
        <ul id="lista-tarefas">
        </ul>

        <ul id="lista-tarefas">
        </ul>

        <button id="btn-limpar">
            Limpar tarefas concluídas
        </button>

    </div>

    <script>
        $(document).ready(function() {

            //Função para adicionar tarefa
            $("#btn-adicionar").click(function() {
                //Pega o valor que o usuário digitou
                let textoTarefa = $("#input-tarefa").val();

                //Verificando se o campo não está vazio
                if(textoTarefa.trim() === ""){
                    alert("Por favor, digite uma tarefa.");
                    return;
                }

                let novaLinha = `
                    <li style="display: none">
                        <span class="texto-tarefa">${textoTarefa}</span>
                        <input type="text" class="input-edicao" value="${textoTarefa}" style="display: none;">
                        <div class="acoes">
                            <button class="btn-editar">Editar</button> 
                            <button class="btn-remover">X</button>
                        </div>
                    </li>
                `;

                //Adicionando a nova linha à lista
                $("#lista-tarefas").append(novaLinha);
                $("#lista-tarefas li:last").fadeIn("fast");

                $("#input-tarefa").val("").focus();
            });

            //Função para remover a tarefa
            $("#lista-tarefas").on("click", ".btn-remover", function() {

                let linhaDaTarefa = $(this).closest("li");

                linhaDaTarefa.fadeOut("fast", function() {''
                        $(this).remove();
                });
            });

            //Função para enviar com a tecla Enter
            $("#input-tarefa").keypress(function(evento) {

                if(evento.which === 13){
                    $("#btn-adicionar").click();
                }
            });
            
            //Função para marcar a tarefa como concluída
            $("#lista-tarefas").on("click", "span", function() {
                
                $(this).parent().toggleClass("concluida");

            });

            //Função para limpar todas a tarefas concluídas
            $("#btn-limpar").click(function() {
                   
                let tarefasConcluidas = $("#lista-tarefas li.concluida");

                if (tarefasConcluidas.length === 0){
                    alert ("Você não tem tarefas concluídas para limpar.");
                    return;
                }

                tarefasConcluidas.fadeOut("fast", function() {
                    $(this).remove();
                });    

            });

            //Funçao para iniciar a edição da tarefa
            $("#lista-tarefas").on("click", ".btn-editar", function() {

                let linha = $(this).closest("li");

                linha.find(".texto-tarefa").hide();
                $(this).hide();

                linha.find(".input-edicao").show().focus();

            });

            //Salvando a edição
            $("#lista-tarefas").on("keypress", ".input-edicao", function(evento) {
                if (evento.which === 13) {
                    let linha = $(this).closest("li");
                    let novoTexto = $(this).val();

                    linha.find(".texto-tarefa"). text(novoTexto).show();

                    $(this).hide();
                    linha.find(".btn-editar").show(); 
                }
            });

        });
    </script>

</body>
</html>
