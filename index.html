<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css">

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-1.12.4.js" integrity="sha256-Qw82+bXyGq6MydymqBxNPYTaUXXq7c8v3CwiYwLLNXU=" crossorigin="anonymous"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/js/bootstrap.min.js"></script>

</head>
    <body>

        <div class="container">
            <div class="page-header">
                <h1>Sistema de Controle <small>Painel Administrativo</small></h1>
            </div>
            <div class="row">
                <div class="col-xs-12 col-md-12">
                    <div class="panel panel-primary">
                        <div class="panel-heading">
                            <h3 class="panel-tittle">Minhas Tarefas</h3>
                        </div>
                        <div class="panel-body">
                            <div class="input-group" style="margin-top: 20px;">
                                <input type="text" id="input-tarefa" class="form-control" placeholder="O que precisa ser feito?">
                                <span class="input-group-btn">
                                    <button class="btn btn-success" id="btn-adicionar" type="button">Adicionar</button>
                                </span>
                            </div>
                            <div style="margin-bottom: 15px;">
                                <small>Progresso das Tarefas</small>
                                <div class="progress" style="margin-top: 5px; margin-bottom: 20px;">
                                    <div id="barra-progresso" class="progress-bar progress-bar-success progress-bar-striped active" role="progressbar" style="width: 0%;">
                                        0%
                                    </div>
                                </div>
                            </div>
                            <ul id="lista-tarefas" class="list-group"></ul>
                            <button id="btn-limpar" class="btn btn-danger btn-block">Limpar tarefas concluídas</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modalConfirmacao" tabindex="-1" role="dialog">
            <div class="modal-dialog modal-sm" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" aria-label="Fechar"><span aria-hidden="true">&times;</span></button>
                        <h4 class="modal-title text-danger">Atenção</h4>
                    </div>
                    <div class="modal-body">
                        <p>Tem certeza que quer excluir esta tarefa?</p>
                    </div>
                    <div class="modal-footer"> 
                        <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="btn-confirmar-exclusao">Sim, excluir</button>
                    </div>
                </div>
            </div>
        </div>

    <script>
        $(document).ready(function() {

            function atualizarProgresso() {
                
                let totalTarefas = $("#lista-tarefas li").length;
                let tarefasConcluidas = $("#lista-tarefas li.concluida").length;

                let porcentagem = 0;

                if (totalTarefas > 0){
                    porcentagem = Math.round((tarefasConcluidas / totalTarefas) * 100);
                }

                $("#barra-progresso")
                    .css ("width", porcentagem + "%")
                    .text(porcentagem + "%");

            }

            let linhaParaExcluir = null;

            //Função para adicionar tarefa
            $("#btn-adicionar").click(function() {
                //Pega o valor que o usuário digitou
                let textoTarefa = $("#input-tarefa").val();

                //Verificando se o campo não está vazio
                if(textoTarefa.trim() === ""){
                    alert("Por favor, digite uma tarefa.");
                    return;
                }

                let novaLinha = `
                    <li class="list-group-item clearfix" style="display: none">
                        <span class="texto-tarefa">${textoTarefa}</span>

                        <input type="text" class="form-control input-edicao" value="${textoTarefa}" style="display: none; width: 60%;">

                        <div class="acoes pull-right">
                            <button class="btn btn-warning btn-sm btn-editar">Editar</button> 
                            <button class="btn btn-danger btn-sm btn-remover">X</button>
                        </div>
                    </li>
                `;

                //Adicionando a nova linha à lista
                $("#lista-tarefas").append(novaLinha);
                $("#lista-tarefas li:last").fadeIn("fast");

                $("#input-tarefa").val("").focus();

                atualizarProgresso();
            });

            //Função para remover a tarefa
            $("#lista-tarefas").on("click", ".btn-remover", function() {

                linhaParaExcluir = $(this).closest("li");

                $("#modalConfirmacao").modal('show');

            });

            $("#btn-confirmar-exclusao").click(function(){

                if (linhaParaExcluir !== null){

                    linhaParaExcluir.fadeOut("fast", function(){
                        $(this).remove();

                        atualizarProgresso();

                    });

                    $("#modalConfirmacao").modal('hide');

                    linhaParaExcluir = null;
                }
                
            });

            //Função para enviar com a tecla Enter
            $("#input-tarefa").keypress(function(evento) {

                if(evento.which === 13){
                    $("#btn-adicionar").click();
                }
            });
            
            //Função para marcar a tarefa como concluída
            $("#lista-tarefas").on("click", "span", function() {
                
                $(this).parent().toggleClass("concluida");

                atualizarProgresso();

            });

            //Função para limpar todas a tarefas concluídas
            $("#btn-limpar").click(function() {
                   
                let tarefasConcluidas = $("#lista-tarefas li.concluida");

                if (tarefasConcluidas.length === 0){
                    alert ("Você não tem tarefas concluídas para limpar.");
                    return;
                }

                tarefasConcluidas.fadeOut("fast", function() {
                    $(this).remove();

                    atualizarProgresso();
                    
                });        

            });

            //Funçao para iniciar a edição da tarefa
            $("#lista-tarefas").on("click", ".btn-editar", function() {

                let linha = $(this).closest("li");

                linha.find(".texto-tarefa").hide();
                $(this).hide();

                linha.find(".input-edicao").show().focus();

            });

            //Salvando a edição
            $("#lista-tarefas").on("keypress", ".input-edicao", function(evento) {
                if (evento.which === 13) {
                    let linha = $(this).closest("li");
                    let novoTexto = $(this).val();

                    linha.find(".texto-tarefa"). text(novoTexto).show();

                    $(this).hide();
                    linha.find(".btn-editar").show(); 
                }
            });

        });
    </script>

</body>
</html>
